        <div id="songNameDisplay" class="truncate max-w-[150px] sm:max-w-xs" w-tid="65">Song: None</div>
        <div class="text-indigo-400 hidden sm:block" w-tid="67">Unified Batch Timeline & Strict Culling Active</div>
    </footer>

    <script w-tid="69">
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            const dpr = window.devicePixelRatio || 1;
            const headerHeight = document.querySelector('header').offsetHeight;
            const footerHeight = document.querySelector('footer').offsetHeight;
            const displayWidth = window.innerWidth;
            const displayHeight = window.innerHeight - headerHeight - footerHeight;

            canvas.width = displayWidth * dpr;
            canvas.height = displayHeight * dpr;
            canvas.style.width = displayWidth + 'px';
            canvas.style.height = displayHeight + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        window.addEventListener('resize', resize);

        const assetUrls = {
            leftArrow: 'https://raw.githubusercontent.com/SENAndrhevn23/fnf-rust-engine-1/refs/heads/master/Notes/LeftArrow.png',
            downArrow: 'https://raw.githubusercontent.com/SENAndrhevn23/fnf-rust-engine-1/refs/heads/master/Notes/DownArrow.png',
            upArrow: 'https://raw.githubusercontent.com/SENAndrhevn23/fnf-rust-engine-1/refs/heads/master/Notes/UpArrow.png',
            rightArrow: 'https://raw.githubusercontent.com/SENAndrhevn23/fnf-rust-engine-1/refs/heads/master/Notes/RightArrow.png',
            leftComing: 'https://raw.githubusercontent.com/SENAndrhevn23/fnf-rust-engine-1/refs/heads/master/Notes/LeftComing.png',
            downComing: 'https://raw.githubusercontent.com/SENAndrhevn23/fnf-rust-engine-1/refs/heads/master/Notes/DownComing.png',
            upComing: 'https://raw.githubusercontent.com/SENAndrhevn23/fnf-rust-engine-1/refs/heads/master/Notes/UpComing.png',
            rightComing: 'https://raw.githubusercontent.com/SENAndrhevn23/fnf-rust-engine-1/refs/heads/master/Notes/RightComing.png'
        };

        const images = {};
        for (let key in assetUrls) {
            images[key] = new Image();
            images[key].crossOrigin = "anonymous";
            images[key].src = assetUrls[key];
        }

        let batchTimeline = {
            notes: [],
            chunks: [],
            scrollSpeed: 2.2,
            songName: "None"
        };

        let isPlaying = false;
        let audio = new Audio();
        let startTime = 0;
        let pauseOffset = 0;
        let score = 0;
        let combo = 0;

        const receptorTimers = { player: [0,0,0,0], opponent: [0,0,0,0] };

        document.getElementById('audioUpload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                audio.src = URL.createObjectURL(file);
                document.getElementById('songNameDisplay').innerText = `Song: ${file.name}`;
            }
        });

        document.getElementById('jsonUpload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const rawData = JSON.parse(event.target.result);
                        parseChartData(rawData);
                    } catch (err) {
                        alert("Error parsing JSON: " + err.message);
                    }
                };
                reader.readAsText(file);
            }
        });

        document.getElementById('stressTestBtn').addEventListener('click', () => {
            generateStressTestChart();
        });

        document.getElementById('playBtn').addEventListener('click', () => {
            if (!isPlaying) {
                startPlayback();
            } else {
                pausePlayback();
            }
        });

        function parseChartData(data) {
            let songData = data.song || data;
            batchTimeline.scrollSpeed = songData.speed || songData.scrollSpeed || 2.2;
            batchTimeline.songName = songData.song || "Custom Chart";

            let rawSections = songData.notes || [];
            batchTimeline.chunks = rawSections;
            batchTimeline.notes = [];

            let noteId = 0;
            rawSections.forEach((section) => {
                let secNotes = section.sectionNotes || [];
                secNotes.forEach(n => {
                    let time = n[0];
                    let dir = n[1] % 4;
                    let mustHit = section.mustHitSection ? (n[1] < 4) : (n[1] >= 4);
                    
                    batchTimeline.notes.push({
                        id: noteId++,
                        time: time,
                        dir: dir,
                        player: mustHit ? 1 : 0,
                        consumed: false
                    });
                });
            });

            // Sort chronologically for strict spatial window culling
            batchTimeline.notes.sort((a, b) => a.time - b.time);

            document.getElementById('chunkStatus').innerText = `● Chunks: ${batchTimeline.chunks.length} Loaded | Notes: ${batchTimeline.notes.length}`;
            document.getElementById('songNameDisplay').innerText = `Song: ${batchTimeline.songName}`;
            document.getElementById('speedDisplay').innerText = `Scroll Speed: ${batchTimeline.scrollSpeed}`;
        }

        function generateStressTestChart() {
            batchTimeline.scrollSpeed = 2.5;
            batchTimeline.songName = "Mega Stress Test (150k Notes)";
            batchTimeline.chunks = new Array(100).fill({});
            batchTimeline.notes = [];

            let noteId = 0;
            for (let i = 0; i < 150000; i++) {
                batchTimeline.notes.push({
                    id: noteId++,
                    time: i * 50,
                    dir: i % 4,
                    player: (i % 2 === 0) ? 1 : 0,
                    consumed: false
                });
            }

            document.getElementById('chunkStatus').innerText = `● Chunks: 100 (Stress Test) | Notes: ${batchTimeline.notes.length}`;
            document.getElementById('songNameDisplay').innerText = `Song: ${batchTimeline.songName}`;
            document.getElementById('speedDisplay').innerText = `Scroll Speed: ${batchTimeline.scrollSpeed}`;

            if (!audio.src) {
                audio.src = "https://actions.google.com/sounds/v1/ambiences/rain_heavy.ogg";
            }
        }

        function startPlayback() {
            if (batchTimeline.notes.length === 0) {
                alert("Please load a chart JSON or click '150k Stress' first!");
                return;
            }
            audio.play().catch(() => {});
            startTime = performance.now() - pauseOffset;
            isPlaying = true;
            document.getElementById('playBtn').innerText = "⏸ Pause";
            document.getElementById('playBtn').className = "bg-amber-600 hover:bg-amber-500 px-3 py-1 rounded font-bold text-[11px]";
        }

        function pausePlayback() {
            audio.pause();
            pauseOffset = performance.now() - startTime;
            isPlaying = false;
            document.getElementById('playBtn').innerText = "▶ Play";
            document.getElementById('playBtn').className = "bg-emerald-600 hover:bg-emerald-500 px-3 py-1 rounded font-bold text-[11px]";
        }

        let lastTime = performance.now();
        let frameCount = 0;
        let fps = 60;

        function gameLoop(now) {
            frameCount++;
            if (now - lastTime >= 1000) {
                fps = frameCount;
                frameCount = 0;
                lastTime = now;
                document.getElementById('fpsDisplay').innerText = `FPS: ${fps}`;
            }

            const width = canvas.width / (window.devicePixelRatio || 1);
            const height = canvas.height / (window.devicePixelRatio || 1);

            // Pristine pitch-black background with NO white lane boxes
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, width, height);

            let songTime = isPlaying ? (performance.now() - startTime) : pauseOffset;
            if (isPlaying && audio.duration && audio.currentTime >= audio.duration) {
                isPlaying = false;
            }

            const isMobile = width < 600;
            const columnWidth = isMobile ? Math.min(38, (width / 9) - 2) : 56;
            const playfieldGap = isMobile ? 30 : 80;
            const totalWidth = (columnWidth * 4 * 2) + playfieldGap;
            const startX = Math.max(10, (width - totalWidth) / 2);

            const oppX = startX;
            const playX = startX + (columnWidth * 4) + playfieldGap;
            const receptorY = isMobile ? 45 : 80;
            const noteSize = columnWidth;

            const arrowKeys = ['leftArrow', 'downArrow', 'upArrow', 'rightArrow'];
            const comingKeys = ['leftComing', 'downComing', 'upComing', 'rightComing'];

            // Draw Opponent Receptors
            for (let i = 0; i < 4; i++) {
                let rx = oppX + (i * columnWidth);
                let lit = receptorTimers.opponent[i] > songTime;
                let imgKey = lit ? arrowKeys[i] : comingKeys[i];
                if (images[imgKey] && images[imgKey].complete) {
                    ctx.drawImage(images[imgKey], rx, receptorY, noteSize, noteSize);
                }
            }

            // Draw Player Receptors
            for (let i = 0; i < 4; i++) {
                let rx = playX + (i * columnWidth);
                let lit = receptorTimers.player[i] > songTime;
                let imgKey = lit ? arrowKeys[i] : comingKeys[i];
                if (images[imgKey] && images[imgKey].complete) {
                    ctx.drawImage(images[imgKey], rx, receptorY, noteSize, noteSize);
                }
            }

            // Strict spatial window culling & instant note consumption (zero splashes)
            let renderedCount = 0;
            const viewMin = songTime - 400;
            const viewMax = songTime + 1200;
            const noteSpeed = 0.45 * batchTimeline.scrollSpeed;

            for (let i = 0; i < batchTimeline.notes.length; i++) {
                let note = batchTimeline.notes[i];

                if (note.consumed) continue;
                if (note.time < viewMin) {
                    if (songTime - note.time > 150) note.consumed = true;
                    continue;
                }
                if (note.time > viewMax) break; // Early break for 150k+ notes performance

                // Autoplayer & opponent auto-hitbox instant note consumption
                if (note.time <= songTime) {
                    note.consumed = true;
                    if (note.player === 1) {
                        receptorTimers.player[note.dir] = songTime + 80;
                        score += 350;
                        combo++;
                    } else {
                        receptorTimers.opponent[note.dir] = songTime + 80;
                    }
                    continue;
                }

                renderedCount++;
                let pX = (note.player === 1 ? playX : oppX) + (note.dir * columnWidth);
                let pY = receptorY + (note.time - songTime) * noteSpeed;

                let noteImgKey = comingKeys[note.dir];
                if (images[noteImgKey] && images[noteImgKey].complete) {
                    ctx.drawImage(images[noteImgKey], pX, pY, noteSize, noteSize);
                }
            }

            document.getElementById('renderedNotesDisplay').innerText = `Rendered Notes: ${renderedCount}`;
            document.getElementById('scoreDisplay').innerText = `Score: ${score} | Combo: ${combo}`;

            requestAnimationFrame(gameLoop);
        }

        resize();
        requestAnimationFrame(gameLoop);
    </script>
